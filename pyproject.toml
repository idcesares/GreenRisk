[project]
name = "greenrisk"
version = "0.2.0"
description = "Explainable-by-construction greenwashing-risk scoring for climate disclosures"
authors = [
    { name = "Isaac D'Césares", email = "isaac.dcesares@ufrj.br" }
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.6.1",
    "numpy>=2.3.0",
    "prov>=2.1.1",
    "rdflib>=7.6.0",
    "scikit-fuzzy>=0.5.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
models = [
    "huggingface-hub>=1.13.0",
    "torch>=2.11.0",
    "transformers>=5.7.0",
]
research = [
    "datasets>=4.8.5",
    "graphviz>=0.21",
    "jupyterlab>=4.5.7",
    "lxml>=5.0.0",
    "matplotlib>=3.11.0",
    "networkx>=3.6.1",
    "pandas>=3.0.0",
    "prov>=2.1.1",
    "pydot>=4.0.1",
    "scikit-fuzzy>=0.5.0",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "transformers>=5.7.0",
]

[project.scripts]
greenrisk = "greenrisk.cli:main"

[project.urls]
Homepage = "https://github.com/idcesares/GreenRisk"
Repository = "https://github.com/idcesares/GreenRisk"
Documentation = "https://github.com/idcesares/GreenRisk/tree/master/docs"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pytest>=9.0.0",
    "ruff>=0.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test_*.py", "test_*.py"]
markers = [
    "model: downloads and executes pinned ClimateBERT models",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
